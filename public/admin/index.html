<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dark Lobby // CMS Admin Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Netlify Identity Widget for Git Gateway Authentication -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      /* Dark Lobby Cyberpunk styling for Decap CMS loading & container */
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* Decap CMS custom theme overrides */
      :root {
        --nc-bg: #090d16;
        --nc-card: #111726;
        --nc-border: #1e293b;
        --nc-primary: #00ff66;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS Application Core -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Netlify Identity Login redirect helper
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.href = "/admin/";
            });
          }
        });
      }

      // Local development helper notification
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.addEventListener('DOMContentLoaded', function() {
          const notice = document.createElement('div');
          notice.style.position = 'fixed';
          notice.style.bottom = '16px';
          notice.style.right = '16px';
          notice.style.backgroundColor = '#111726';
          notice.style.border = '1px solid #00ff66';
          notice.style.boxShadow = '0 0 15px rgba(0, 255, 102, 0.25)';
          notice.style.color = '#f8fafc';
          notice.style.padding = '12px 18px';
          notice.style.borderRadius = '8px';
          notice.style.fontFamily = 'monospace';
          notice.style.fontSize = '12px';
          notice.style.zIndex = '999999';
          notice.style.maxWidth = '360px';
          notice.style.lineHeight = '1.5';
          notice.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;"><strong style="color:#00ff66;">⚡ LOCAL CMS PROXY:</strong><button onclick="this.parentElement.parentElement.remove()" style="background:none; border:none; color:#64748b; cursor:pointer; font-size:14px;">✕</button></div>To edit & save markdown files on localhost, run in terminal:<br/><code style="color:#00ff66; background:#090d16; padding:3px 8px; border-radius:4px; display:inline-block; margin-top:5px; border:1px solid #1e293b;">npm.cmd run cms</code><br/><span style="color:#94a3b8; font-size:10px; display:inline-block; margin-top:4px;">In production (Netlify), Git Gateway connects automatically!</span>';
          document.body.appendChild(notice);
        });
      }
    </script>
  </body>
</html>
