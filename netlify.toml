# ========================================================
# Netlify Configuration for Dark Lobby
# Astro v5 + Decap CMS Production Deployment Settings
# ========================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Decap CMS Admin Portal route rewrite
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# 404 Fallback routing
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache immutable Astro assets for ultra-fast CDN delivery
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache media uploads and static images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
